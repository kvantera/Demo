<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CryptoTag — Сценарій 6</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060e18;font-family:"Courier New",monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100vw;min-height:100vh;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(0,180,100,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,180,100,.04) 1px,transparent 1px);background-size:44px 44px;pointer-events:none}
#title{font-size:clamp(11px,1.7vw,17px);font-weight:900;letter-spacing:5px;color:#ff8800;text-shadow:0 0 24px #ff8800;margin-bottom:2px;text-align:center}
#subtitle{font-size:clamp(8px,1.1vw,10px);letter-spacing:3px;color:rgba(200,200,200,.5);text-align:center;margin-bottom:4px}
#lbl{font-size:clamp(8px,1.2vw,11px);letter-spacing:3px;color:#ffcc00;text-align:center;margin-bottom:5px;min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:95vw}
#wrap{position:relative;width:min(960px,100vw);aspect-ratio:16/9}
canvas{display:block;width:100%;height:100%;background:#07111c;border:1px solid rgba(255,136,0,.2);border-radius:4px}
#explain{position:absolute;right:8px;top:8px;width:clamp(155px,24%,230px);background:rgba(255,255,255,.96);border:2px solid #003366;border-radius:5px;overflow:hidden;pointer-events:none;display:none}
#explain-head{background:#003366;color:#fff;font-weight:bold;padding:5px 9px;font-size:clamp(8px,1.1vw,11px);letter-spacing:1px}
#explain-body{padding:7px 9px;color:#000033;line-height:1.65;font-size:clamp(7px,1vw,10px)}
#le{display:none}
#status{margin-top:5px;font-size:clamp(8px,1.4vw,11px);letter-spacing:2px;text-align:center;min-height:18px;transition:color .3s;white-space:nowrap;overflow:hidden;max-width:95vw}
#ctrl{margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cbtn{background:transparent;border:1px solid #00ff88;color:#00ff88;font-family:"Courier New",monospace;font-size:10px;letter-spacing:2px;padding:6px 16px;cursor:pointer;border-radius:2px;transition:all .2s}
.cbtn:hover{background:rgba(0,255,136,.12)}
#restartBtn{display:none}
</style>
</head>
<body>
<div id="title">◈ CRYPTOTAG — СЦЕНАРІЙ 6: НРК З АВТО-ТУРЕЛЕЮ ◈</div>
<div id="subtitle">НРК + АВТО-ТУРЕЛЬ · IFF ІНТЕГРАЦІЯ · СВІЙ — НЕ СТРІЛЯТИ · ЧУЖИЙ — ЗНИЩИТИ</div>
<div id="lbl">ІНІЦІАЛІЗАЦІЯ...</div>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="explain"><div id="explain-head">💡 ПОЯСНЕННЯ</div><div id="explain-body"></div></div>
  <div id="le"></div>
</div>
<div id="status"></div>
<div id="ctrl">
  <button class="cbtn" id="pauseBtn" onclick="togglePause()">⏸ ПАУЗА</button>
  <button class="cbtn" id="restartBtn" onclick="init()">▶ ПЕРЕЗАПУСТИТИ</button>
  <button class="cbtn" onclick="location.href='index.html'">◀ НАЗАД</button>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("c"),ctx=cv.getContext("2d");
var W=960,H=540;
var G="#00ff88",R="#ff3333",Y="#ffcc00",B="#00cfff",WH="#ffffff";
var FRONTY=355;
var CX=88,CY=115,OX=88,OY=228;
var RX=470,RY=182;

// ── Key state ──
var whiteKeyAnim=0,whiteKeyAtREB=false;
var ctrlYellowAnim=0,ctrlYellowDone=false;
var yellowKeyAnim=0,yellowKeyOnPlane=false;

var paused=false,scIdx=0,scTimer=0;

// ── Util ──
function setLbl(t){document.getElementById("lbl").textContent=t;}
function setSt(t,c){var s=document.getElementById("status");s.textContent=t;s.style.color=c;}
function showEx(h,b){var p=document.getElementById("explain");document.getElementById("explain-head").textContent="💡 "+h;document.getElementById("explain-body").textContent=b;p.style.display="block";}
function hideEx(){document.getElementById("explain").style.display="none";}
function gw(c,b){ctx.shadowColor=c;ctx.shadowBlur=b;}
function ng(){ctx.shadowColor="transparent";ctx.shadowBlur=0;}

// ── Background ──
function drawBg(){
  ctx.fillStyle="rgba(0,255,136,.032)";ctx.fillRect(0,0,W,FRONTY);
  ctx.fillStyle="rgba(255,51,51,.032)";ctx.fillRect(0,FRONTY,W,H-FRONTY);
  ctx.strokeStyle="rgba(0,200,120,.04)";ctx.lineWidth=1;
  for(var x=0;x<W;x+=44){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(var y=0;y<H;y+=44){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.fillStyle="rgba(0,255,136,.018)";ctx.fillRect(0,(Date.now()/18)%H,W,2);
}
function drawFront(){
  ctx.save();ctx.strokeStyle="#ff8800";ctx.lineWidth=2.5;gw("#ff8800",12);
  ctx.setLineDash([16,8]);ctx.beginPath();ctx.moveTo(0,FRONTY);ctx.lineTo(W,FRONTY);ctx.stroke();
  ctx.setLineDash([]);ng();
  ctx.font="bold 10px \"Courier New\"";
  ctx.fillStyle="rgba(0,255,136,.55)";ctx.textAlign="left";ctx.fillText("▲  НАША СТОРОНА",14,FRONTY-10);
  ctx.fillStyle="rgba(255,51,51,.55)";ctx.fillText("▼  ВОРОЖА СТОРОНА",14,FRONTY+20);
  ctx.fillStyle="rgba(255,136,0,.7)";ctx.font="9px \"Courier New\"";ctx.textAlign="center";
  ctx.fillText("— — —  ЛІНІЯ ФРОНТУ  — — —",W/2,FRONTY-5);
  ctx.restore();
}

// ── People ──
function drawPerson(x,y,lbl,col){
  col=col||Y;
  ctx.save();gw(col,8);ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y-28,9,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.stroke();
  ctx.strokeStyle=col===Y?G:"#ff6600";ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y-34,10,Math.PI,0);ctx.stroke();
  ctx.strokeStyle=col;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x,y-19);ctx.lineTo(x,y+4);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-11,y-12);ctx.lineTo(x+11,y-12);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x,y+4);ctx.lineTo(x-7,y+22);ctx.moveTo(x,y+4);ctx.lineTo(x+7,y+22);ctx.stroke();
  ng();ctx.fillStyle=col;ctx.font="9px \"Courier New\"";ctx.textAlign="center";ctx.fillText(lbl,x,y+34);
  ctx.restore();
}

// ── REB (shared) ──
function drawREB(x,y){
  ctx.save();gw(B,10);ctx.fillStyle=B;ctx.fillRect(x-18,y-13,36,26);ng();
  ctx.strokeStyle=B;ctx.lineWidth=1.5;ctx.strokeRect(x-18,y-13,36,26);
  ctx.fillStyle="rgba(0,207,255,.18)";ctx.fillRect(x-11,y-7,22,14);
  ctx.fillStyle=B;ctx.font="11px \"Courier New\"";ctx.textAlign="center";ctx.fillText("IFF",x,y+3);
  gw(B,6);ctx.strokeStyle=B;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x,y-13);ctx.lineTo(x,y-42);ctx.stroke();
  ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y-42,13,Math.PI*1.1,Math.PI*1.9);ctx.stroke();
  [8,14,20].forEach(function(r){ctx.globalAlpha=0.12+0.06*(20-r)/20;ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y-55,r,Math.PI*1.15,Math.PI*1.85);ctx.stroke();});
  ctx.globalAlpha=1;var pulse=0.4+Math.sin(Date.now()/300)*0.6;
  ctx.globalAlpha=pulse;ctx.fillStyle=B;ctx.beginPath();ctx.arc(x,y-55,3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ng();
  // Memory card
  var mx=x,my=y-75;
  ctx.fillStyle="rgba(0,10,20,.92)";ctx.strokeStyle=B;ctx.lineWidth=1.5;gw(B,5);
  ctx.beginPath();ctx.roundRect(mx-22,my-18,44,32,3);ctx.fill();ctx.stroke();ng();
  [mx-14,mx-6,mx+2,mx+10].forEach(function(cx){gw(Y,3);ctx.fillStyle=Y;ctx.fillRect(cx,my+10,6,4);ng();});
  ctx.fillStyle=B;ctx.font="bold 7px \"Courier New\"";ctx.textAlign="center";ctx.fillText("ЖУРНАЛ",mx,my+2);
  var dp=0.4+Math.sin(Date.now()/400)*0.6;ctx.globalAlpha=dp;gw(G,8);ctx.fillStyle=G;
  ctx.beginPath();ctx.arc(mx+14,my-4,3,0,Math.PI*2);ctx.fill();ng();ctx.globalAlpha=1;
  // White key at REB center
  if(whiteKeyAtREB){
    ctx.save();gw(WH,14);ctx.strokeStyle=WH;ctx.fillStyle=WH;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(x-8,y+2,6,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(x-8,y+2,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(x-2,y+2);ctx.lineTo(x+12,y+2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+10,y+2);ctx.lineTo(x+10,y+7);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x+6,y+2);ctx.lineTo(x+6,y+6);ctx.stroke();
    ng();ctx.fillStyle=WH;ctx.font="bold 8px \"Courier New\"";ctx.textAlign="center";ctx.fillText("ЗАКРИТИЙ КЛЮЧ",x,y+18);ctx.restore();
  }
  ctx.fillStyle=B;ctx.font="13px \"Courier New\"";ctx.textAlign="center";ctx.fillText("ЗАПИТУВАЧ",x,y+42);ctx.restore();
}

// ── Plane with yellow/green key ──
function drawPlane(x,y,dir,flt,keyCol,keyLbl){
  flt=flt||0;
  ctx.save();ctx.translate(x,y+flt);ctx.scale(dir,1);
  gw(G,keyCol?18:8);ctx.fillStyle=G;
  ctx.beginPath();ctx.moveTo(28,0);ctx.lineTo(-20,7);ctx.lineTo(-15,0);ctx.lineTo(-20,-7);ctx.closePath();ctx.fill();
  ctx.fillStyle="rgba(0,220,120,.85)";
  ctx.beginPath();ctx.moveTo(5,-3);ctx.lineTo(-9,-27);ctx.lineTo(-17,-27);ctx.lineTo(-8,-3);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(5,3);ctx.lineTo(-9,27);ctx.lineTo(-17,27);ctx.lineTo(-8,3);ctx.closePath();ctx.fill();
  ctx.fillStyle=G;ctx.beginPath();ctx.moveTo(-15,-6);ctx.lineTo(-25,-18);ctx.lineTo(-20,-6);ctx.closePath();ctx.fill();
  if(keyCol){
    gw(keyCol,12);ctx.strokeStyle=keyCol;ctx.fillStyle=keyCol;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(-8,14,5,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(-8,14,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(-3,14);ctx.lineTo(8,14);ctx.stroke();
    ctx.beginPath();ctx.moveTo(6,14);ctx.lineTo(6,19);ctx.stroke();ng();
  }
  ng();ctx.restore();
  ctx.save();ctx.fillStyle=G;ctx.font="12px \"Courier New\"";ctx.textAlign="center";
  ctx.fillText("БПЛА (СВІЙ)",x,y+flt-36);
  if(keyCol&&keyLbl){gw(keyCol,8);ctx.fillStyle=keyCol;ctx.font="8px \"Courier New\"";ctx.fillText(keyLbl,x,y+flt+28);ng();}
  ctx.restore();
}

// ── Signal ──
function Sig(x1,y1,x2,y2,col,lbl,cb,spd){this.x1=x1;this.y1=y1;this.x2=x2;this.y2=y2;this.col=col;this.lbl=lbl;this.cb=cb;this.spd=spd||0.02;this.p=0;this.done=false;}
Sig.prototype.tick=function(){if(this.done)return;this.p=Math.min(1,this.p+this.spd);if(this.p>=1){this.done=true;if(this.cb)this.cb();}};
Sig.prototype.draw=function(){
  var px=this.x1+(this.x2-this.x1)*this.p,py=this.y1+(this.y2-this.y1)*this.p;
  ctx.save();gw(this.col,10);ctx.strokeStyle=this.col;ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(this.x1,this.y1);ctx.lineTo(px,py);ctx.stroke();ng();
  gw(this.col,14);ctx.fillStyle=this.col;ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.fill();ng();
  if(this.p>0.25&&this.p<0.78&&this.lbl){ctx.fillStyle=this.col;ctx.font="bold 10px \"Courier New\"";ctx.textAlign="center";ctx.fillText(this.lbl,this.x1+(px-this.x1)*0.5,this.y1+(py-this.y1)*0.5-12);}
  ctx.restore();
};
function FSig(x1,y1,x2,y2,cb){this.x1=x1;this.y1=y1;this.x2=x2;this.y2=y2;this.cb=cb;this.p=0;this.done=false;this.spd=0.04;this.fl=0;}
FSig.prototype.tick=function(){if(this.done)return;this.p=Math.min(1,this.p+this.spd);this.fl+=0.25;if(this.p>=1){this.done=true;if(this.cb)this.cb();}};
FSig.prototype.draw=function(){
  var px=this.x1+(this.x2-this.x1)*this.p,py=this.y1+(this.y2-this.y1)*this.p;
  ctx.save();ctx.strokeStyle="rgba(255,51,51,.25)";ctx.lineWidth=10;gw(R,20);ctx.setLineDash([14,6]);
  ctx.beginPath();ctx.moveTo(this.x1,this.y1);ctx.lineTo(px,py);ctx.stroke();
  ctx.strokeStyle=R;ctx.lineWidth=3;gw(R,14);ctx.beginPath();ctx.moveTo(this.x1,this.y1);ctx.lineTo(px,py);ctx.stroke();
  ctx.setLineDash([]);ng();var pulse=0.6+Math.sin(this.fl)*0.4;ctx.globalAlpha=pulse;gw(R,24);ctx.fillStyle=R;
  ctx.beginPath();ctx.arc(px,py,7,0,Math.PI*2);ctx.fill();ng();ctx.globalAlpha=1;
  if(this.p>0.2&&this.p<0.85){gw(R,12);ctx.fillStyle=R;ctx.font="bold 11px \"Courier New\"";ctx.textAlign="center";ctx.fillText("ЗНИЩИТИ!",this.x1+(px-this.x1)*0.55,this.y1+(py-this.y1)*0.55-16);ng();}
  ctx.restore();
};
function Shell(x1,y1,x2,y2,cb){this.x1=x1;this.y1=y1;this.x2=x2;this.y2=y2;this.cb=cb;this.p=0;this.done=false;this.trail=[];}
Shell.prototype.tick=function(){
  if(this.done)return;this.p=Math.min(1,this.p+0.055);
  var cx=this.x1+(this.x2-this.x1)*this.p,cy=this.y1+(this.y2-this.y1)*this.p;
  this.trail.push({x:cx,y:cy,a:1});this.trail.forEach(function(t){t.a-=0.07;});this.trail=this.trail.filter(function(t){return t.a>0;});
  if(this.p>=1){this.done=true;if(this.cb)this.cb();}
};
Shell.prototype.draw=function(){
  this.trail.forEach(function(t){ctx.save();ctx.globalAlpha=t.a*.5;gw("#ff8800",6);ctx.fillStyle="#ff8800";ctx.beginPath();ctx.arc(t.x,t.y,3,0,Math.PI*2);ctx.fill();ng();ctx.restore();});
  if(this.done)return;
  var cx=this.x1+(this.x2-this.x1)*this.p,cy=this.y1+(this.y2-this.y1)*this.p;
  ctx.save();gw(Y,18);ctx.fillStyle=Y;ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.fill();ng();ctx.restore();
};
function Boom(x,y){this.x=x;this.y=y;this.r=0;this.life=1;this.pts=[];for(var i=0;i<24;i++){this.pts.push({vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,x:x,y:y,life:1,col:Math.random()>.5?R:Y});}}
Boom.prototype.tick=function(){this.life-=0.022;this.r+=5;this.pts.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.life-=0.026;p.vy+=0.12;});};
Boom.prototype.draw=function(){
  if(this.life<=0)return;
  ctx.save();ctx.globalAlpha=this.life*0.4;gw(R,22);ctx.strokeStyle=R;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.stroke();ng();ctx.restore();
  this.pts.forEach(function(p){if(p.life<=0)return;ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ctx.restore();});
};
function Fire(x,y){this.x=x;this.y=y;this.age=0;this.embers=[];}
Fire.prototype.tick=function(){
  this.age++;
  if(Math.random()<0.35){this.embers.push({x:this.x+(Math.random()-.5)*18,y:this.y+(Math.random()-.5)*8,vx:(Math.random()-.5)*1.2,vy:-(Math.random()*2+0.8),life:1,size:Math.random()*4+2,col:Math.random()<0.5?"#ff4400":"#ff8800"});}
  this.embers.forEach(function(e){e.x+=e.vx;e.y+=e.vy;e.vy+=0.05;e.life-=0.025;});
  this.embers=this.embers.filter(function(e){return e.life>0;});
};
Fire.prototype.draw=function(){
  var x=this.x,y=this.y,t=this.age*0.08;
  var grad=ctx.createRadialGradient(x,y,0,x,y,20);grad.addColorStop(0,"rgba(255,100,0,.7)");grad.addColorStop(1,"rgba(255,0,0,0)");
  ctx.save();ctx.fillStyle=grad;ctx.beginPath();ctx.ellipse(x,y,20,10,0,0,Math.PI*2);ctx.fill();ctx.restore();
  [[0,16],[-7,12],[7,12]].forEach(function(fl,i){
    var wobble=Math.sin(t+i*1.3)*4;ctx.save();
    var fg=ctx.createLinearGradient(x+fl[0],y,x+fl[0]+wobble,y-fl[1]);fg.addColorStop(0,"rgba(255,80,0,.9)");fg.addColorStop(1,"rgba(255,240,0,0)");
    ctx.fillStyle=fg;ctx.beginPath();ctx.moveTo(x+fl[0]-4,y);ctx.quadraticCurveTo(x+fl[0]+wobble-5,y-fl[1]*.5,x+fl[0]+wobble,y-fl[1]);ctx.quadraticCurveTo(x+fl[0]+wobble+5,y-fl[1]*.5,x+fl[0]+7,y);ctx.closePath();ctx.fill();ctx.restore();
  });
  this.embers.forEach(function(e){ctx.save();ctx.globalAlpha=e.life;gw(e.col,5);ctx.fillStyle=e.col;ctx.beginPath();ctx.arc(e.x,e.y,e.size*e.life,0,Math.PI*2);ctx.fill();ng();ctx.restore();});
};
function Zenith(x,y){this.x=x;this.y=y;this.ang=-Math.PI*.7;}
Zenith.prototype.aimAt=function(tx,ty){var targ=Math.atan2(ty-(this.y+4),tx-this.x);this.ang+=(targ-this.ang)*0.02;return Math.abs(targ-this.ang)<0.02;};
Zenith.prototype.draw=function(col,lbl){
  col=col||B;lbl=lbl||"НРК + ТУРЕЛЬ";
  ctx.save();gw(col,8);ctx.fillStyle=col;ctx.fillRect(this.x-18,this.y+4,36,16);ng();
  ctx.strokeStyle=col;ctx.lineWidth=2;[-11,11].forEach(function(ox){ctx.beginPath();ctx.arc(this.x+ox,this.y+20,6,0,Math.PI*2);ctx.stroke();gw(col,4);ctx.fillStyle=col;ctx.beginPath();ctx.arc(this.x+ox,this.y+20,2.5,0,Math.PI*2);ctx.fill();ng();}.bind(this));
  ctx.translate(this.x,this.y+4);ctx.rotate(this.ang);
  gw(col,10);ctx.strokeStyle=col;ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(38,0);ctx.stroke();ng();
  ctx.fillStyle="#88eeff";ctx.beginPath();ctx.arc(38,0,4,0,Math.PI*2);ctx.fill();
  gw(col,6);ctx.fillStyle=col;ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.fill();ng();ctx.restore();
  ctx.fillStyle=col;ctx.font="13px \"Courier New\"";ctx.textAlign="center";ctx.fillText(lbl,this.x,this.y+42);
};


var ZX6=660,ZY6=158;
var zen6=null;
function drawZoneAndZenith(x,y,ang,armed){
  if(armed){
    ctx.save();ctx.globalAlpha=0.07+Math.sin(Date.now()/400)*0.03;
    ctx.fillStyle=R;ctx.beginPath();ctx.moveTo(x,y);
    ctx.arc(x,y,240,-Math.PI*0.08,-Math.PI*0.92,true);ctx.closePath();ctx.fill();
    ctx.globalAlpha=1;
    ctx.strokeStyle="rgba(255,51,51,.3)";ctx.lineWidth=1.5;ctx.setLineDash([6,4]);
    ctx.beginPath();ctx.arc(x,y,240,-Math.PI*0.08,-Math.PI*0.92,true);ctx.stroke();
    ctx.setLineDash([]);ctx.restore();
  }
  var col=armed?R:G;
  ctx.save();
  // NRC vehicle body
  gw(col,8);
  ctx.fillStyle="rgba(20,35,20,.95)";ctx.strokeStyle=col;ctx.lineWidth=2;
  ctx.beginPath();ctx.roundRect(x-32,y+4,64,20,3);ctx.fill();ctx.stroke();
  // Tracks
  ctx.fillStyle="rgba(50,50,50,.9)";ctx.strokeStyle=col;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.roundRect(x-36,y+20,72,10,3);ctx.fill();ctx.stroke();
  [-26,-14,-2,10,22].forEach(function(ox){
    ctx.beginPath();ctx.arc(x+ox,y+25,4,0,Math.PI*2);ctx.stroke();
  });
  // Turret base
  ctx.fillStyle="rgba(30,50,30,.95)";ctx.strokeStyle=col;ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(x,y+4,12,0,Math.PI*2);ctx.fill();ctx.stroke();
  // Rotating gun barrel
  ctx.translate(x,y+4);ctx.rotate(ang);
  gw(col,12);ctx.strokeStyle=col;ctx.lineWidth=8;
  ctx.beginPath();ctx.moveTo(-4,0);ctx.lineTo(40,0);ctx.stroke();
  ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(6,-4);ctx.lineTo(40,-4);ctx.stroke();
  ctx.beginPath();ctx.moveTo(6,4);ctx.lineTo(40,4);ctx.stroke();
  ng();ctx.fillStyle="#88ffcc";ctx.beginPath();ctx.arc(40,0,5,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // IFF antenna on vehicle
  ctx.save();gw(B,6);ctx.strokeStyle=B;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x+22,y+4);ctx.lineTo(x+22,y-16);ctx.stroke();
  ctx.beginPath();ctx.arc(x+22,y-16,5,Math.PI*1.2,Math.PI*1.8);ctx.stroke();ng();
  ctx.fillStyle=B;ctx.font="8px \"Courier New\"";ctx.textAlign="center";ctx.fillText("IFF",x+22,y-24);ctx.restore();
  ctx.fillStyle=col;ctx.font="12px \"Courier New\"";ctx.textAlign="center";
  ctx.fillText(armed?"НРК (АКТИВНА)":"НРК (БЕЗПЕЧНО)",x,y+44);
  ctx.restore();
}
function drawKeyAnims(planeX,planeY){
  // White key flying ctrl→REB
  if(whiteKeyAnim>0&&whiteKeyAnim<1){
    var t=whiteKeyAnim,sx=CX+14,sy=CY-10,ex=RX,ey=RY+2;
    var kx=sx+(ex-sx)*t,ky=sy+(ey-sy)*t-40*Math.sin(t*Math.PI);
    ctx.save();gw(WH,12);ctx.strokeStyle=WH;ctx.fillStyle=WH;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(kx-6,ky,5,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(kx-6,ky,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(kx-1,ky);ctx.lineTo(kx+10,ky);ctx.stroke();ctx.beginPath();ctx.moveTo(kx+8,ky);ctx.lineTo(kx+8,ky+4);ctx.stroke();ng();ctx.restore();
  }
  // Yellow key flying ctrl→op
  if(ctrlYellowAnim>0&&ctrlYellowAnim<1){
    var tcy=ctrlYellowAnim,sx2=CX+14,sy2=CY-10,ex2=OX+14,ey2=OY-10;
    var kx2=sx2+(ex2-sx2)*tcy,ky2=sy2+(ey2-sy2)*tcy-30*Math.sin(tcy*Math.PI);
    ctx.save();gw(Y,12);ctx.strokeStyle=Y;ctx.fillStyle=Y;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(kx2-6,ky2,5,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(kx2-6,ky2,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(kx2-1,ky2);ctx.lineTo(kx2+10,ky2);ctx.stroke();ctx.beginPath();ctx.moveTo(kx2+8,ky2);ctx.lineTo(kx2+8,ky2+4);ctx.stroke();ng();ctx.restore();
  }
  // Op holds yellow key
  if(ctrlYellowDone&&!yellowKeyOnPlane&&yellowKeyAnim===0){
    ctx.save();gw(Y,10);ctx.strokeStyle=Y;ctx.fillStyle=Y;ctx.lineWidth=2;
    var hkx=OX+14,hky=OY-12;
    ctx.beginPath();ctx.arc(hkx-5,hky,5,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(hkx-5,hky,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(hkx,hky);ctx.lineTo(hkx+10,hky);ctx.stroke();ctx.beginPath();ctx.moveTo(hkx+8,hky);ctx.lineTo(hkx+8,hky+4);ctx.stroke();ng();ctx.restore();
  }
  // Yellow key flying op→plane
  if(yellowKeyAnim>0&&yellowKeyAnim<1&&planeX){
    var t3=yellowKeyAnim,sx3=OX+14,sy3=OY-10,ex3=planeX,ey3=planeY;
    var kx3=sx3+(ex3-sx3)*t3,ky3=sy3+(ey3-sy3)*t3-50*Math.sin(t3*Math.PI);
    ctx.save();gw(Y,12);ctx.strokeStyle=Y;ctx.fillStyle=Y;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(kx3-6,ky3,5,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(kx3-6,ky3,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(kx3-1,ky3);ctx.lineTo(kx3+10,ky3);ctx.stroke();ctx.beginPath();ctx.moveTo(kx3+8,ky3);ctx.lineTo(kx3+8,ky3+4);ctx.stroke();ng();ctx.restore();
  }
}

// ── First 3 shared scenes ──
var SHARED_SCENES=[
  {fr:130,lbl:"СЦЕНА 1: КОНТРОЛЕР Т — ЗАКРИТИЙ КЛЮЧ ДО ЗАПИТУВАЧА",fn:function(){

    setTimeout(function(){whiteKeyAnim=0.01;},600);
  }},
  {fr:120,lbl:"СЦЕНА 2: КОНТРОЛЕР Т — ВІДКРИТИЙ КЛЮЧ ДО ОПЕРАТОРА",fn:function(){
    setSt("Контролер Т передає відкритий ключ оператору",Y);
    showEx("Підготовка: відкритий ключ","Контролер Т передає ВІДКРИТИЙ (жовтий) ключ skᵢ⁰ оператору. Це початковий секретний ключ БПЛА. Оператор встановить його на борт перед місією.");
    ctrlYellowAnim=0.01;
  }},
  {fr:100,lbl:"СЦЕНА 3: ОПЕРАТОР — КЛЮЧ НА БПЛА",fn:function(){
    setSt("Оператор надсилає відкритий ключ на БПЛА",Y);
    showEx("Ключ на борту","Оператор передає жовтий ключ на БПЛА. Тепер БПЛА може відповідати на IFF запити. Підготовка завершена.");
    yellowKeyAnim=0.01;
  }},
];

var CUSTOM_SCENES=[

  {fr:160,lbl:"СЦЕНА 4: НАШ БПЛА ВХОДИТЬ В ЗОНУ ПАТРУЛЮВАННЯ НРК",fn:function(){
    S.zenArmed=true;
    setSt("⚠️ НАШ БПЛА ВХОДИТЬ В ЗОНУ ПАТРУЛЮВАННЯ НРК!",Y);
    showEx("НРК з авто-турелею","Наземний роботизований комплекс (НРК) з автоматичною турелею охороняє периметр. Без IFF він стріляє по всьому, що рухається. CryptoTag дає турелі відповідь: Свій чи Чужий?")
  }},
  {fr:220,lbl:"СЦЕНА 5: НРК → IFF ЗАПИТ → СВІЙ ✓ → АВТО-ТУРЕЛЬ НЕ СТРІЛЯЄ",fn:function(){
    setSt("НРК: IFF запит → Свій ✓ → турель опускається",B);
    showEx("Авто-турель запитує: Хто ти?","НРК надсилає IFF запит: xᵗ+TB. БПЛА відповідає підписом yᵢ=H(skᵢᵗ). Турель перевіряє за 15мс: Q(H(yᵢ))=J[i] ✓ → СВІЙ → не стріляти. Все автоматично, без оператора.")
    S.sigZQ=new Sig(ZX6,ZY6,S.fpx,S.fpy,B,"ХТО ТИ?",function(){
      setTimeout(function(){
        S.sigZR=new Sig(S.fpx,S.fpy,ZX6,ZY6,G,"СВІЙ ✓",function(){
          S.friendlyOK=true;S.zenArmed=false;
          setSt("СВІЙ ✓ — НРК: НЕ СТРІЛЯТИ. БПЛА проходить безпечно",G);
          showEx("СВІЙ — турель опускається","Верифікація: СВІЙ. НРК отримує команду НЕ СТРІЛЯТИ — турель повертається в нейтральне положення. БПЛА проходить зону безпечно.")
        },0.025);},300);},0.025);
  }},
  {fr:160,lbl:"СЦЕНА 6: НАШ БПЛА ПРОЙШОВ — ВОРОЖИЙ В ЗОНІ НРК",fn:function(){
    S.zenArmed=true;S.eneActive=true;
    setSt("⚠️ ВОРОЖИЙ БПЛА ВХОДИТЬ В ТУ САМУ ЗОНУ!",R);
    showEx("Ворожий БПЛА в зоні НРК","Ворожий дрон входить в зону патрулювання. НРК надсилає той самий IFF запит. Ворожий БПЛА не має ключа CryptoTag — відповісти правильно неможливо.")
  }},
  {fr:230,lbl:"СЦЕНА 7: НРК IFF → ВОРОГ МОВЧИТЬ → ЧУЖИЙ → АВТО-ТУРЕЛЬ!",fn:function(){
    setSt("НРК: IFF запит → Тиша → ЧУЖИЙ! → Авто-турель ВОГОНЬ!",R);
    showEx("ЧУЖИЙ — турель відкриває вогонь","Ворог отримав запит але не може відповісти без ключа. Таймаут=ЧУЖИЙ. Автоматична команда зенітці: ЗНИЩИТИ! Без участі людини.");
    S.sigEQ=new Sig(ZX6,ZY6,S.epx,S.epy,B,"ХТО ТИ?",function(){
      setTimeout(function(){
        S.enemyExposed=true;setSt("ТИША → ЧУЖИЙ → НРК АВТО-ТУРЕЛЬ: ВОГОНЬ!",R);
        setTimeout(function(){
          S.sigFire=new FSig(RX,RY,ZX6,ZY6,function(){S.zenAiming=true;});
        },40);},600);},0.022);
  }},
  {fr:200,lbl:"СЦЕНА 8: НРК + CRYPTOTAG — ДРУЖНІЙ ВОГОНЬ = НУЛЬ",fn:function(){
    setSt("НРК + CryptoTag: Свій — пропустити, Чужий — знищити ✓",G);
    showEx("НРК + CryptoTag: нульовий дружній вогонь","Свій БПЛА пройшов безпечно. Чужий знищено. Дружній вогонь: виключено.");
    document.getElementById("restartBtn").style.display="inline-block";
    document.getElementById("pauseBtn").style.display="none";
  }},

];

var ALL_SCENES=SHARED_SCENES.concat(CUSTOM_SCENES);
var raf,ft=0;

function startScene(i){
  if(i>=ALL_SCENES.length)return;
  scIdx=i;scTimer=ALL_SCENES[i].fr;setLbl(ALL_SCENES[i].lbl);ALL_SCENES[i].fn();
}


var S={
  fpx:240,fpy:180,fdir:1,
  epx:840,epy:440,
  zenAng:-Math.PI*.5,zenArmed:false,zenAiming:false,
  sigZQ:null,sigZR:null,sigEQ:null,sigFire:null,shell:null,mFlash:0,
  friendlyOK:false,enemyExposed:false,eneActive:false,enemyDead:false,
  boom:null};
var explosions6=[];
function init(){
  cancelAnimationFrame(raf);paused=false;ft=0;explosions6=[];
  whiteKeyAnim=0;whiteKeyAtREB=false;ctrlYellowAnim=0;ctrlYellowDone=false;yellowKeyAnim=0;yellowKeyOnPlane=false;
  scIdx=0;scTimer=0;
  S={fpx:240,fpy:180,fdir:1,epx:840,epy:440,zenAng:-Math.PI*.5,zenArmed:false,zenAiming:false,
    sigZQ:null,sigZR:null,sigEQ:null,sigFire:null,shell:null,mFlash:0,
    friendlyOK:false,enemyExposed:false,eneActive:false,enemyDead:false,boom:null};
  var pb=document.getElementById("pauseBtn");if(pb){pb.style.display="inline-block";pb.textContent="⏸ ПАУЗА";pb.style.color="#00ff88";pb.style.borderColor="#00ff88";}
  document.getElementById("restartBtn").style.display="none";
  hideEx();startScene(0);loop();
}


function loop(){
  ctx.clearRect(0,0,W,H);drawBg();drawFront();
  ft+=0.04;

  // Key anim ticks
  if(whiteKeyAnim>0&&whiteKeyAnim<1){whiteKeyAnim=Math.min(1,whiteKeyAnim+0.014);if(whiteKeyAnim>=1)whiteKeyAtREB=true;}
  if(ctrlYellowAnim>0&&ctrlYellowAnim<1){ctrlYellowAnim=Math.min(1,ctrlYellowAnim+0.028);if(ctrlYellowAnim>=1)ctrlYellowDone=true;}
  if(yellowKeyAnim>0&&yellowKeyAnim<1){yellowKeyAnim=Math.min(1,yellowKeyAnim+0.04);if(yellowKeyAnim>=1)yellowKeyOnPlane=true;}

  
  if(S.sigZQ){S.sigZQ.x2=S.fpx;S.sigZQ.y2=S.fpy;S.sigZQ.tick();}
  if(S.sigZR){S.sigZR.x1=S.fpx;S.sigZR.y1=S.fpy;S.sigZR.tick();}
  if(S.sigEQ){S.sigEQ.x2=S.epx;S.sigEQ.y2=S.epy;S.sigEQ.tick();}
  if(S.sigFire)S.sigFire.tick();
  // Friendly plane movement
  if(scIdx===4){var fp={x:S.fpx,y:S.fpy};var dx=ZX6+80-fp.x,dy=ZY6-fp.y,d=Math.sqrt(dx*dx+dy*dy);if(d>2){S.fpx+=dx/d*1.5;S.fpy+=dy/d*1.5;}S.fdir=1;}
  if(scIdx>=5){var fp2={x:S.fpx,y:S.fpy};var dx2=ZX6+160-fp2.x,dy2=ZY6+10-fp2.y,d2=Math.sqrt(dx2*dx2+dy2*dy2);if(d2>2){S.fpx+=dx2/d2*1.0;S.fpy+=dy2/d2*1.0;}}
  // Enemy plane movement
  if(S.eneActive&&!S.enemyDead){var ep={x:S.epx,y:S.epy};var dx3=ZX6-60-ep.x,dy3=220-ep.y,d3=Math.sqrt(dx3*dx3+dy3*dy3);if(d3>2){S.epx+=dx3/d3*1.6;S.epy+=dy3/d3*1.6;}}
  // Zenith aims enemy
  if(S.zenAiming&&!S.enemyDead){
    var dx4=S.epx-ZX6,dy4=S.epy-(ZY6+4),targ=Math.atan2(dy4,dx4);S.zenAng+=(targ-S.zenAng)*0.02;
    if(Math.abs(targ-S.zenAng)<0.02&&!S.shell){
      S.mFlash=6;var bx=ZX6+Math.cos(S.zenAng)*38,by=(ZY6+4)+Math.sin(S.zenAng)*38;
      S.shell=new Shell(bx,by,S.epx,S.epy,function(){explosions6.push(new Boom(S.epx,S.epy));S.enemyDead=true;setSt("ВОРОЖИЙ БПЛА ЗНИЩЕНО ✓  Дружній вогонь = 0",G);});
    }
  }
  if(S.mFlash>0)S.mFlash--;
  if(S.shell)S.shell.tick();
  explosions6=explosions6.filter(function(e){return e.life>0;});explosions6.forEach(function(e){e.tick();});


  // People
  drawPerson(CX,CY,"КОНТРОЛЕР Т");
  drawPerson(OX,OY,"ОПЕРАТОР");
  drawREB(RX,RY);

  
  drawZoneAndZenith(ZX6,ZY6,S.zenAng,S.zenArmed);
  if(S.mFlash>0){var fbx=ZX6+Math.cos(S.zenAng)*38,fby=(ZY6+4)+Math.sin(S.zenAng)*38;ctx.save();ctx.globalAlpha=S.mFlash/6;gw(Y,40);ctx.fillStyle=Y;ctx.beginPath();ctx.arc(fbx,fby,20,0,Math.PI*2);ctx.fill();ng();ctx.restore();}
  if(S.shell)S.shell.draw();

  // Yellow key: op→friendly plane
  if(yellowKeyAnim>0&&yellowKeyAnim<1){
    var t3=yellowKeyAnim,sx3=OX+14,sy3=OY-10,ex3=S.fpx,ey3=S.fpy;
    var kx3=sx3+(ex3-sx3)*t3,ky3=sy3+(ey3-sy3)*t3-50*Math.sin(t3*Math.PI);
    ctx.save();gw(Y,12);ctx.strokeStyle=Y;ctx.fillStyle=Y;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(kx3-6,ky3,5,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(kx3-6,ky3,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(kx3-1,ky3);ctx.lineTo(kx3+10,ky3);ctx.stroke();ctx.beginPath();ctx.moveTo(kx3+8,ky3);ctx.lineTo(kx3+8,ky3+4);ctx.stroke();ng();ctx.restore();
  }

  // Friendly plane with yellow key
  drawPlane(S.fpx,S.fpy,S.fdir,Math.sin(ft)*3,yellowKeyOnPlane?Y:null,yellowKeyOnPlane?"КЛЮЧ СЕСІЇ":null);
  if(S.friendlyOK){gw(G,12);ctx.fillStyle=G;ctx.font="bold 11px \"Courier New\"";ctx.textAlign="center";ctx.fillText("✓ СВІЙ — НЕ СТРІЛЯТИ",S.fpx,S.fpy-50);ng();}

  // Enemy quad
  if(S.eneActive&&!S.enemyDead){
    ctx.save();ctx.translate(S.epx,S.epy+Math.sin(ft+1)*3.5);
    gw(R,12);ctx.fillStyle=R;ctx.beginPath();ctx.ellipse(0,0,14,8,0,0,Math.PI*2);ctx.fill();ng();
    [[-18,-18],[18,-18],[-18,18],[18,18]].forEach(function(a){
      ctx.strokeStyle=R;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(a[0],a[1]);ctx.stroke();
      ctx.strokeStyle="rgba(255,80,80,.5)";ctx.lineWidth=1.5;
      ctx.beginPath();ctx.ellipse(a[0],a[1],6,2,.5,0,Math.PI*2);ctx.stroke();
    });ctx.restore();
    ctx.fillStyle=R;ctx.font="12px \"Courier New\"";ctx.textAlign="center";ctx.fillText("БПЛА (ЧУЖИЙ)",S.epx,S.epy+38);
    if(S.enemyExposed){var ep2=0.5+Math.sin(ft*3)*0.4;ctx.save();ctx.globalAlpha=ep2;gw(R,10);ctx.fillStyle=R;ctx.font="bold 11px \"Courier New\"";ctx.textAlign="center";ctx.fillText("✗ ЧУЖИЙ — ЗНИЩИТИ!",S.epx,S.epy-45);ng();ctx.restore();}
  }

  if(S.sigZQ&&!S.sigZQ.done)S.sigZQ.draw();
  if(S.sigZR&&!S.sigZR.done)S.sigZR.draw();
  if(S.sigEQ&&!S.sigEQ.done)S.sigEQ.draw();
  if(S.sigFire&&!S.sigFire.done)S.sigFire.draw();
  explosions6.forEach(function(e){e.draw();});

  if(S.enemyDead){
    ctx.save();ctx.fillStyle="rgba(0,20,10,.88)";ctx.beginPath();ctx.roundRect(W/2-220,H-62,440,48,8);ctx.fill();
    gw(G,12);ctx.strokeStyle=G;ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(W/2-220,H-62,440,48,8);ctx.stroke();ng();
    ctx.fillStyle=G;ctx.font="bold 14px \"Courier New\"";ctx.textAlign="center";ctx.fillText("✓ СВІЙ — БЕЗПЕЧНО    ✗ ЧУЖИЙ — ЗНИЩЕНО",W/2,H-30);ctx.restore();
  }


  // Key animations (always on top of people but below signals)
  drawKeyAnims(typeof S!=="undefined"&&S?S.px:null,typeof S!=="undefined"&&S?S.py:null);

  scTimer--;
  if(scTimer<=0&&scIdx<ALL_SCENES.length-1)startScene(scIdx+1);
  raf=requestAnimationFrame(loop);
}

window.togglePause=function(){
  paused=!paused;var btn=document.getElementById("pauseBtn");
  if(paused){cancelAnimationFrame(raf);btn.textContent="▶ ПРОДОВЖИТИ";btn.style.color="#ffcc00";btn.style.borderColor="#ffcc00";}
  else{btn.textContent="⏸ ПАУЗА";btn.style.color="#00ff88";btn.style.borderColor="#00ff88";loop();}
};
window.init=init;
window.addEventListener("load",function(){init();});
})();
</script>
