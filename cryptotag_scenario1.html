<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CryptoTag — Сценарій 1: Автентифікація</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060e18;font-family:"Courier New",monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100vw;min-height:100vh;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(0,180,100,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,180,100,.04) 1px,transparent 1px);background-size:44px 44px;pointer-events:none}
#title{font-size:clamp(16px,2.5vw,26px);font-weight:900;letter-spacing:6px;color:#00ff88;text-shadow:0 0 24px #00ff88;margin-bottom:4px;text-align:center;white-space:nowrap}
#lbl{font-size:clamp(11px,1.6vw,15px);letter-spacing:3px;color:#ffcc00;text-align:center;margin-bottom:6px;min-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:95vw}
#wrap{position:relative;width:min(960px,100vw);aspect-ratio:16/9}
canvas{display:block;width:100%;height:100%;background:#07111c;border:1px solid rgba(0,255,136,.15);border-radius:4px;box-shadow:0 0 50px rgba(0,255,136,.07)}
#explain{position:absolute;right:8px;top:8px;width:clamp(155px,23%,225px);background:rgba(255,255,255,.96);border:2px solid #003366;border-radius:5px;overflow:hidden;pointer-events:none;display:none}
#explain-head{background:#003366;color:#fff;font-weight:bold;padding:5px 9px;font-size:clamp(8px,1.1vw,11px);letter-spacing:1px}
#explain-body{padding:7px 9px;color:#000033;line-height:1.65;font-size:clamp(7px,1vw,10px)}
#log{position:absolute;right:8px;top:8px;width:clamp(130px,20%,200px);background:rgba(0,0,0,.82);border:1px solid rgba(0,255,136,.2);border-left:2px solid #00ff88;border-radius:4px;padding:8px;font-size:clamp(8px,1.3vw,11px);line-height:1.8;max-height:58%;overflow:hidden;pointer-events:none}
#log-title{color:#ffcc00;letter-spacing:2px;margin-bottom:4px;font-size:11px}
.ll{opacity:0;animation:fi .3s forwards}
.lg{color:#00ff88}.lr{color:#ff3333}.ly{color:#ffcc00}.lb{color:#00cfff}
@keyframes fi{to{opacity:1}}
#status{margin-top:6px;font-size:clamp(12px,1.8vw,15px);letter-spacing:2px;text-align:center;min-height:18px;transition:color .3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:95vw}
#ctrl{margin-top:8px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cbtn{background:transparent;border:1px solid #00ff88;color:#00ff88;font-family:"Courier New",monospace;font-size:10px;letter-spacing:2px;padding:7px 18px;cursor:pointer;border-radius:2px;transition:all .2s}
.cbtn:hover{background:rgba(0,255,136,.12)}
#restartBtn{display:none}
#speechBtn.off{border-color:#ff3333;color:#ff3333}


/* ── Mobile responsive ── */
@media (max-width:600px){
  #title{font-size:13px;letter-spacing:3px;}
  #lbl{font-size:9px;letter-spacing:1px;}
  #status{font-size:10px;letter-spacing:1px;}
  #log{display:none;} /* hide log on mobile — too small */
  .cbtn{font-size:11px;padding:9px 16px;}
  #wrap{width:100vw;}
}
@media (max-width:400px){
  #title{font-size:11px;letter-spacing:2px;}
}
</style>
</head>
<body>
<div id="title">◈ CRYPTOTAG — СЦЕНАРІЙ 1: АВТЕНТИФІКАЦІЯ ◈</div>
<div id="lbl">ІНІЦІАЛІЗАЦІЯ...</div>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="log"><div id="log-title">▌ SYSTEM LOG</div><div id="le"></div>
  <div id="explain"><div id="explain-head">💡 ПОЯСНЕННЯ</div><div id="explain-body"></div></div></div>
</div>
<div id="status"></div>
<div id="ctrl">
  <button class="cbtn" onclick="location.href='index.html'">◀ НАЗАД</button>
  <button class="cbtn" id="soundBtn" onclick="toggleSound()">🔊 ЗВУК</button>
  <button class="cbtn" id="restartBtn" onclick="init()">▶ ПЕРЕЗАПУСТИТИ</button>
  <button class="cbtn" id="pauseBtn" onclick="togglePause()">⏸ ПАУЗА</button>
</div>
<script>
(function(){
"use strict";
var cv=document.getElementById("c"),ctx=cv.getContext("2d");
var W=960,H=540;
var G="#00ff88",R="#ff3333",Y="#ffcc00",B="#00cfff";

// ── Positions ──────────────────────────────────────────
var FRONTY=355;
var CX=95,CY=115;   // controller
var OX=95,OY=235;   // operator
var RX=480,RY=180;  // interrogator
var ZX=640,ZY=165;  // zenith
var PHX=210,PHY=195;// plane home
var PRX=700,PRY=420;// plane recon
var PRY2=188;       // plane return altitude
var EX0=670,EY0=452;// enemy start
var EYC=298;        // enemy chase altitude

// ── Sound Effects (Web Audio API, no files needed) ───────
var audioCtx = null;

function getAudioCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}



// Resume AudioContext on user gesture (required by browsers)
document.addEventListener('click', function(){
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}, {once: false});

// ── Util ───────────────────────────────────────────────
function addJournal(entry){
  if(!S||!S.journal)return;
  var now=new Date();
  var ts=now.getHours().toString().padStart(2,"0")+":"+
         now.getMinutes().toString().padStart(2,"0")+":"+
         now.getSeconds().toString().padStart(2,"0");
  S.journal.push({time:ts, text:entry, t:Date.now()});
  if(S.journal.length>6)S.journal.shift();
}

function showEx(title,body){var p=document.getElementById("explain");if(!p)return;document.getElementById("explain-head").textContent="💡 "+title;document.getElementById("explain-body").textContent=body;p.style.display="block";}
function hideEx(){var p=document.getElementById("explain");if(p)p.style.display="none";}
function addLog(t,c){
  var el=document.getElementById("le");
  var d=document.createElement("div");d.className="ll "+c;d.textContent=t;
  el.appendChild(d);
  if(el.children.length>13)el.removeChild(el.firstChild);
}
function setLbl(t){document.getElementById("lbl").textContent=t;}
function setSt(t,c){var s=document.getElementById("status");s.textContent=t;s.style.color=c;}
function gw(c,b){ctx.shadowColor=c;ctx.shadowBlur=b;}
function ng(){ctx.shadowColor="transparent";ctx.shadowBlur=0;}

// ── Draw ───────────────────────────────────────────────
function drawBg(){
  ctx.fillStyle="rgba(0,255,136,.032)";ctx.fillRect(0,0,W,FRONTY);
  ctx.fillStyle="rgba(255,51,51,.032)";ctx.fillRect(0,FRONTY,W,H-FRONTY);
  ctx.strokeStyle="rgba(0,200,120,.04)";ctx.lineWidth=1;
  for(var x=0;x<W;x+=44){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(var y=0;y<H;y+=44){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.fillStyle="rgba(0,255,136,.018)";
  ctx.fillRect(0,(Date.now()/18)%H,W,2);
}

function drawFront(){
  ctx.save();
  ctx.strokeStyle="#ff8800";ctx.lineWidth=2.5;gw("#ff8800",12);
  ctx.setLineDash([16,8]);
  ctx.beginPath();ctx.moveTo(0,FRONTY);ctx.lineTo(W,FRONTY);ctx.stroke();
  ctx.setLineDash([]);ng();
  ctx.font='bold 13px "Courier New"';
  ctx.fillStyle="rgba(0,255,136,.55)";ctx.textAlign="left";
  ctx.fillText("▲  НАША СТОРОНА",14,FRONTY-10);
  ctx.fillStyle="rgba(255,51,51,.55)";
  ctx.fillText("▼  ВОРОЖА СТОРОНА",14,FRONTY+20);
  ctx.fillStyle="rgba(255,136,0,.7)";ctx.font='13px "Courier New"';
  ctx.textAlign="center";
  ctx.fillText("— — —  ЛІНІЯ ФРОНТУ  — — —",W/2,FRONTY-5);
  ctx.restore();
}

function drawPerson(x,y,tag,lbl){
  ctx.save();
  gw(Y,8);ctx.fillStyle=Y;
  ctx.beginPath();ctx.arc(x,y-28,9,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=Y;ctx.lineWidth=2.5;ctx.stroke();
  ctx.strokeStyle=G;ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(x,y-34,10,Math.PI,0);ctx.stroke();
  ctx.strokeStyle=Y;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(x,y-19);ctx.lineTo(x,y+4);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-11,y-12);ctx.lineTo(x+11,y-12);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x,y+4);ctx.lineTo(x-7,y+22);
  ctx.moveTo(x,y+4);ctx.lineTo(x+7,y+22);ctx.stroke();ng();
  ctx.fillStyle=Y;ctx.font='13px "Courier New"';ctx.textAlign="center";
  ctx.fillText(lbl,x,y+34);
  if(tag){
    gw(G,14);ctx.fillStyle=G;ctx.fillRect(x+12,y-19,18,11);ng();
    ctx.strokeStyle=G;ctx.lineWidth=1;ctx.strokeRect(x+12,y-19,18,11);
    ctx.fillStyle="#000";ctx.font='9px "Courier New"';ctx.textAlign="left";
    ctx.fillText("CT",x+15,y-11);
  }
  ctx.restore();
}

function drawPlane(x,y,dir,tag,al){
  if(al===undefined)al=1;
  ctx.save();ctx.globalAlpha=al;ctx.translate(x,y);ctx.scale(dir,1);
  gw(G,tag?22:8);ctx.fillStyle=G;
  ctx.beginPath();ctx.moveTo(28,0);ctx.lineTo(-20,7);ctx.lineTo(-15,0);ctx.lineTo(-20,-7);ctx.closePath();ctx.fill();
  ctx.fillStyle="rgba(0,220,120,.85)";
  ctx.beginPath();ctx.moveTo(5,-3);ctx.lineTo(-9,-27);ctx.lineTo(-17,-27);ctx.lineTo(-8,-3);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(5,3);ctx.lineTo(-9,27);ctx.lineTo(-17,27);ctx.lineTo(-8,3);ctx.closePath();ctx.fill();
  ctx.fillStyle=G;
  ctx.beginPath();ctx.moveTo(-15,-6);ctx.lineTo(-25,-18);ctx.lineTo(-20,-6);ctx.closePath();ctx.fill();
  ctx.fillStyle="rgba(180,255,220,.28)";
  ctx.beginPath();ctx.ellipse(15,0,6,4,0,0,Math.PI*2);ctx.fill();
  if(tag){
    ctx.fillStyle="#000";ctx.fillRect(-5,-4,11,7);
    ctx.strokeStyle=G;ctx.lineWidth=1;ctx.strokeRect(-5,-4,11,7);
    ctx.fillStyle=G;ctx.font='8px "Courier New"';ctx.textAlign="center";ctx.fillText("CT",1,2);
  }
  ng();ctx.restore();
  ctx.save();ctx.globalAlpha=al;ctx.fillStyle=G;
  ctx.font='14px "Courier New"';ctx.textAlign="center";
  ctx.fillText("БПЛА (СВІЙ)",x,y-36);

  // Key on plane — yellow (current session) or green (new session computed)
  if(S&&S.yellowKeyOnPlane){
    ctx.save();ctx.globalAlpha=al;
    var kc=S.yellowKeyColor||Y;
    var isGreen=kc===G||kc==="#00ff88";
    // Glow effect for new key
    var glowSize=isGreen?(16+Math.sin(Date.now()/200)*6):14;
    gw(kc,glowSize);
    ctx.strokeStyle=kc;ctx.fillStyle=kc;ctx.lineWidth=isGreen?3:2.5;
    var kx=x, ky=y+16;
    // Key shape
    ctx.beginPath();ctx.arc(kx-8,ky,isGreen?6:5,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(kx-8,ky,isGreen?3:2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(kx-2,ky);ctx.lineTo(kx+12,ky);ctx.stroke();
    ctx.beginPath();ctx.moveTo(kx+10,ky);ctx.lineTo(kx+10,ky+5);ctx.stroke();
    ctx.beginPath();ctx.moveTo(kx+6,ky);ctx.lineTo(kx+6,ky+4);ctx.stroke();
    ng();
    ctx.fillStyle=kc;
    ctx.font='bold '+(isGreen?9:8)+'px "Courier New"';
    ctx.textAlign="center";
    if(isGreen){
      ctx.fillText("НОВИЙ КЛЮЧ",kx,ky+17);
      ctx.font='7px "Courier New"';
      ctx.fillText("СЕСІЯ +1",kx,ky+27);
    } else {
      ctx.fillText("КЛЮЧ СЕСІЇ",kx,ky+17);
    }
    ctx.restore();
  }
  // New key generation animation — sparks around plane
  if(S&&S.newKeyGenerating){
    ctx.save();ctx.globalAlpha=al;
    var t=Date.now()/150;
    for(var si=0;si<6;si++){
      var sa=t+si*(Math.PI*2/6);
      var sr=20+Math.sin(t*2+si)*5;
      var spx=x+Math.cos(sa)*sr, spy=y+Math.sin(sa)*sr;
      gw(G,8);ctx.fillStyle=G;
      ctx.beginPath();ctx.arc(spx,spy,2,0,Math.PI*2);ctx.fill();ng();
    }
    ctx.restore();
  }
  ctx.restore();
}

function drawEnemy(x,y,al){
  if(al===undefined)al=1;
  ctx.save();ctx.globalAlpha=al;ctx.translate(x,y);
  gw(R,12);ctx.fillStyle=R;
  ctx.beginPath();ctx.ellipse(0,0,15,9,0,0,Math.PI*2);ctx.fill();ng();
  var arms=[[-20,-20],[20,-20],[-20,20],[20,20]];
  for(var i=0;i<arms.length;i++){
    var ax=arms[i][0],ay=arms[i][1];
    ctx.strokeStyle=R;ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(ax,ay);ctx.stroke();
    ctx.strokeStyle="rgba(255,80,80,.5)";ctx.lineWidth=1.5;
    ctx.beginPath();ctx.ellipse(ax,ay,7,2.5,.5,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.ellipse(ax,ay,7,2.5,-.5,0,Math.PI*2);ctx.stroke();
  }
  ctx.restore();
  ctx.save();ctx.globalAlpha=al;ctx.fillStyle=R;
  ctx.font='14px "Courier New"';ctx.textAlign="center";
  ctx.fillText("БПЛА (ЧУЖИЙ)",x,y+34);ctx.restore();
}

function drawREB(x,y){
  ctx.save();
  // Base box
  gw(B,10);ctx.fillStyle=B;ctx.fillRect(x-18,y-13,36,26);ng();
  ctx.strokeStyle=B;ctx.lineWidth=1.5;ctx.strokeRect(x-18,y-13,36,26);
  // Screen
  ctx.fillStyle="rgba(0,207,255,.18)";ctx.fillRect(x-11,y-7,22,14);
  ctx.fillStyle=B;ctx.font='11px "Courier New"';ctx.textAlign="center";ctx.fillText("IFF",x,y+3);

  // Antenna mast (vertical pole)
  gw(B,6);ctx.strokeStyle=B;ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(x,y-13);ctx.lineTo(x,y-42);ctx.stroke();

  // Antenna dish (parabolic arc at top)
  ctx.lineWidth=2;
  ctx.beginPath();
  ctx.arc(x, y-42, 13, Math.PI*1.1, Math.PI*1.9);
  ctx.stroke();

  // Dish support struts
  ctx.lineWidth=1.5;
  ctx.beginPath();
  ctx.moveTo(x,y-42);
  ctx.lineTo(x-10,y-50);
  ctx.moveTo(x,y-42);
  ctx.lineTo(x+10,y-50);
  ctx.stroke();

  // Signal waves (3 arcs radiating from dish)
  ctx.lineWidth=1;
  [8,14,20].forEach(function(r){
    ctx.globalAlpha=0.15+0.08*(20-r)/20;
    ctx.beginPath();
    ctx.arc(x,y-55,r,Math.PI*1.15,Math.PI*1.85);
    ctx.stroke();
  });
  ctx.globalAlpha=1;ng();

  // Blinking dot at dish center
  var pulse=0.5+Math.sin(Date.now()/300)*0.5;
  ctx.globalAlpha=pulse;
  gw(B,10);ctx.fillStyle=B;
  ctx.beginPath();ctx.arc(x,y-55,3,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;ng();

  ctx.fillStyle=B;ctx.font='14px "Courier New"';ctx.textAlign="center";
  ctx.fillText("ЗАПИТУВАЧ",x,y+42);

  // Memory card above REB antenna
  ctx.save();
  var mx=x, my=y-72;
  // Card body
  ctx.fillStyle="rgba(0,10,20,.9)";
  ctx.strokeStyle=B;ctx.lineWidth=1.5;gw(B,6);
  ctx.beginPath();ctx.roundRect(mx-22,my-18,44,32,3);ctx.fill();ctx.stroke();ng();
  // Card notch (top-right corner cut)
  ctx.fillStyle="rgba(0,10,20,.9)";ctx.strokeStyle=B;ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(mx+14,my-18);ctx.lineTo(mx+22,my-10);ctx.lineTo(mx+22,my-18);ctx.closePath();
  ctx.fillStyle="#07111c";ctx.fill();ctx.strokeStyle=B;ctx.stroke();
  // Gold contacts at bottom
  [mx-14,mx-6,mx+2,mx+10].forEach(function(cx){
    ctx.fillStyle="#ffcc00";gw("#ffcc00",3);
    ctx.fillRect(cx,my+10,6,4);
  });ng();
  // Label
  ctx.fillStyle=B;ctx.font='bold 7px "Courier New"';ctx.textAlign="center";
  ctx.fillText("ЖУРНАЛ",mx,my+2);
  // Dot indicator
  var dotPulse=0.4+Math.sin(Date.now()/400)*0.6;
  ctx.globalAlpha=dotPulse;gw(G,8);ctx.fillStyle=G;
  ctx.beginPath();ctx.arc(mx+14,my-4,3,0,Math.PI*2);ctx.fill();ng();
  ctx.globalAlpha=1;
  ctx.restore();

  // White private key — centered in REB box after arrival
  if(typeof S!=="undefined"&&S&&S.whiteKeyAtREB){
    var blink = S.iffBlinking ? (Math.floor(Date.now()/200)%2===0) : true;
    if(blink){
      ctx.save();
      var kx=x, ky=y+2;
      // Blinking white or yellow depending on IFF state
      var kcol = (S.iffKeyAnim>0&&S.iffKeyAnim<1)||S.iffBlinking ? Y : "#ffffff";
      gw(kcol,16);
      ctx.strokeStyle=kcol;ctx.fillStyle=kcol;ctx.lineWidth=2.5;
      // Ring
      ctx.beginPath();ctx.arc(kx-9,ky,7,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.arc(kx-9,ky,3.5,0,Math.PI*2);ctx.fill();
      // Shaft
      ctx.beginPath();ctx.moveTo(kx-2,ky);ctx.lineTo(kx+14,ky);ctx.stroke();
      ctx.beginPath();ctx.moveTo(kx+12,ky);ctx.lineTo(kx+12,ky+5);ctx.stroke();
      ctx.beginPath();ctx.moveTo(kx+8,ky);ctx.lineTo(kx+8,ky+4);ctx.stroke();
      ng();
      ctx.fillStyle=kcol;ctx.font='bold 8px "Courier New"';
      ctx.textAlign="center";ctx.fillText("ЗАКРИТИЙ КЛЮЧ",x,y+18);
      ctx.restore();
    }
  }
  ctx.restore();
}

function drawZenith(x,y,ang){
  ctx.save();
  gw(B,8);ctx.fillStyle=B;ctx.fillRect(x-18,y+4,36,16);ng();
  ctx.strokeStyle="rgba(0,180,220,.4)";ctx.lineWidth=1;ctx.strokeRect(x-18,y+4,36,16);
  ctx.strokeStyle=B;ctx.lineWidth=2;
  [-11,11].forEach(function(ox){
    ctx.beginPath();ctx.arc(x+ox,y+20,6,0,Math.PI*2);ctx.stroke();
    gw(B,4);ctx.fillStyle=B;ctx.beginPath();ctx.arc(x+ox,y+20,2.5,0,Math.PI*2);ctx.fill();ng();
  });
  ctx.translate(x,y+4);ctx.rotate(ang);
  gw(B,10);ctx.strokeStyle=B;ctx.lineWidth=6;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(38,0);ctx.stroke();ng();
  ctx.fillStyle="#88eeff";ctx.beginPath();ctx.arc(38,0,4,0,Math.PI*2);ctx.fill();
  gw(B,6);ctx.fillStyle=B;ctx.beginPath();ctx.arc(0,0,9,0,Math.PI*2);ctx.fill();ng();
  ctx.restore();
  ctx.fillStyle=B;ctx.font='14px "Courier New"';ctx.textAlign="center";
  ctx.fillText("ЗЕНІТКА",x,y+42);
}

// ── Signal ─────────────────────────────────────────────
function Sig(x1,y1,x2,y2,col,lbl,cb,spd){
  this.x1=x1;this.y1=y1;this.x2=x2;this.y2=y2;
  this.col=col;this.lbl=lbl;this.cb=cb;
  this.spd=spd||0.018;this.p=0;this.done=false;
}
Sig.prototype.tick=function(){
  if(this.done)return;
  this.p=Math.min(1,this.p+this.spd);
  if(this.p>=1){this.done=true;if(this.cb)this.cb();}
};
Sig.prototype.draw=function(){
  var px=this.x1+(this.x2-this.x1)*this.p;
  var py=this.y1+(this.y2-this.y1)*this.p;
  ctx.save();gw(this.col,10);ctx.strokeStyle=this.col;ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(this.x1,this.y1);ctx.lineTo(px,py);ctx.stroke();ng();
  gw(this.col,16);ctx.fillStyle=this.col;
  ctx.beginPath();ctx.arc(px,py,4,0,Math.PI*2);ctx.fill();ng();
  if(this.p>0.25&&this.p<0.82){
    var mx=this.x1+(px-this.x1)*0.55,my=this.y1+(py-this.y1)*0.55-12;
    gw(this.col,8);ctx.fillStyle=this.col;
    ctx.font='bold 13px "Courier New"';ctx.textAlign="center";
    ctx.fillText(this.lbl,mx,my);ng();
  }
  ctx.restore();
};

function FSig(x1,y1,x2,y2,cb){
  this.x1=x1;this.y1=y1;this.x2=x2;this.y2=y2;
  this.cb=cb;this.p=0;this.done=false;this.spd=0.04;this.fl=0;
}
FSig.prototype.tick=function(){
  if(this.done)return;
  this.p=Math.min(1,this.p+this.spd);this.fl+=0.25;
  if(this.p>=1){this.done=true;if(this.cb)this.cb();}
};
FSig.prototype.draw=function(){
  var px=this.x1+(this.x2-this.x1)*this.p;
  var py=this.y1+(this.y2-this.y1)*this.p;
  ctx.save();
  ctx.strokeStyle="rgba(255,51,51,.25)";ctx.lineWidth=10;gw(R,20);
  ctx.setLineDash([14,6]);
  ctx.beginPath();ctx.moveTo(this.x1,this.y1);ctx.lineTo(px,py);ctx.stroke();
  ctx.strokeStyle=R;ctx.lineWidth=3;gw(R,14);
  ctx.beginPath();ctx.moveTo(this.x1,this.y1);ctx.lineTo(px,py);ctx.stroke();
  ctx.setLineDash([]);ng();
  var pulse=0.6+Math.sin(this.fl)*0.4;
  ctx.globalAlpha=pulse;gw(R,24);ctx.fillStyle=R;
  ctx.beginPath();ctx.arc(px,py,7,0,Math.PI*2);ctx.fill();ng();ctx.globalAlpha=1;
  if(this.p>0.2&&this.p<0.85){
    var mx=this.x1+(px-this.x1)*0.55,my=this.y1+(py-this.y1)*0.55-16;
    gw(R,12);ctx.fillStyle=R;ctx.font='bold 14px "Courier New"';
    ctx.textAlign="center";ctx.fillText("ЗНИЩИТИ!",mx,my);ng();
  }
  ctx.restore();
};

function Shell(x1,y1,x2,y2,cb){
  this.x1=x1;this.y1=y1;this.x2=x2;this.y2=y2;
  this.cb=cb;this.p=0;this.done=false;this.trail=[];
}
Shell.prototype.tick=function(){
  if(this.done)return;
  this.p=Math.min(1,this.p+0.055);
  var cx=this.x1+(this.x2-this.x1)*this.p;
  var cy=this.y1+(this.y2-this.y1)*this.p;
  this.trail.push({x:cx,y:cy,a:1});
  for(var i=0;i<this.trail.length;i++)this.trail[i].a-=0.07;
  this.trail=this.trail.filter(function(t){return t.a>0;});
  if(this.p>=1){this.done=true;if(this.cb)this.cb();}
};
Shell.prototype.draw=function(){
  for(var i=0;i<this.trail.length;i++){
    var t=this.trail[i];
    ctx.save();ctx.globalAlpha=t.a*0.55;gw("#ff8800",6);ctx.fillStyle="#ff8800";
    ctx.beginPath();ctx.arc(t.x,t.y,3,0,Math.PI*2);ctx.fill();ng();ctx.restore();
  }
  if(this.done)return;
  var cx=this.x1+(this.x2-this.x1)*this.p;
  var cy=this.y1+(this.y2-this.y1)*this.p;
  ctx.save();gw(Y,18);ctx.fillStyle=Y;
  ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.fill();ng();ctx.restore();
};

// Persistent fire at explosion site
function Fire(x,y){
  this.x=x; this.y=y; this.life=1; this.age=0;
  this.embers=[];
}
Fire.prototype.tick=function(){
  this.age++;
  // Add new embers randomly
  if(Math.random()<0.4){
    this.embers.push({
      x:this.x+(Math.random()-0.5)*20,
      y:this.y+(Math.random()-0.5)*10,
      vx:(Math.random()-0.5)*1.5,
      vy:-(Math.random()*2+1),
      life:1,
      size:Math.random()*5+2,
      col:Math.random()<0.5?"#ff4400":Math.random()<0.5?"#ff8800":"#ffcc00"
    });
  }
  this.embers.forEach(function(e){
    e.x+=e.vx; e.y+=e.vy; e.vy+=0.05; e.life-=0.025;
  });
  this.embers=this.embers.filter(function(e){return e.life>0;});
};
Fire.prototype.draw=function(){
  var x=this.x, y=this.y;
  // Smoke
  for(var i=0;i<3;i++){
    var sr=8+i*6, sa=0.06-i*0.015;
    ctx.save();ctx.globalAlpha=sa*(0.5+Math.sin(this.age*0.05+i)*0.3);
    ctx.fillStyle="#888";
    ctx.beginPath();ctx.arc(x+(Math.sin(this.age*0.03+i)*8),y-20-i*12,sr,0,Math.PI*2);
    ctx.fill();ctx.restore();
  }
  // Base glow
  ctx.save();
  var grad=ctx.createRadialGradient(x,y,0,x,y,22);
  grad.addColorStop(0,"rgba(255,100,0,0.7)");
  grad.addColorStop(0.5,"rgba(255,50,0,0.3)");
  grad.addColorStop(1,"rgba(255,0,0,0)");
  ctx.fillStyle=grad;
  ctx.beginPath();ctx.ellipse(x,y,22,12,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
  // Flame tongues
  var t=this.age*0.08;
  [[0,18],[- 8,14],[8,14],[-4,20],[4,20]].forEach(function(fl,i){
    var fx=fl[0], fh=fl[1];
    var wobble=Math.sin(t+i*1.3)*4;
    ctx.save();
    var fg=ctx.createLinearGradient(x+fx,y,x+fx+wobble,y-fh);
    fg.addColorStop(0,"rgba(255,80,0,0.9)");
    fg.addColorStop(0.5,"rgba(255,180,0,0.7)");
    fg.addColorStop(1,"rgba(255,240,0,0)");
    ctx.fillStyle=fg;
    ctx.beginPath();
    ctx.moveTo(x+fx-4,y);
    ctx.quadraticCurveTo(x+fx+wobble-6,y-fh*0.5,x+fx+wobble,y-fh);
    ctx.quadraticCurveTo(x+fx+wobble+6,y-fh*0.5,x+fx+8,y);
    ctx.closePath();ctx.fill();ctx.restore();
  });
  // Embers
  this.embers.forEach(function(e){
    ctx.save();ctx.globalAlpha=e.life;
    gw(e.col,6);ctx.fillStyle=e.col;
    ctx.beginPath();ctx.arc(e.x,e.y,e.size*e.life,0,Math.PI*2);ctx.fill();ng();
    ctx.restore();
  });
};

function Boom(x,y){
  this.x=x;this.y=y;this.r=0;this.life=1;
  this.pts=[];
  for(var i=0;i<26;i++){
    var cols=[R,Y,"#ff8800","#ff6600"];
    this.pts.push({vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,x:x,y:y,life:1,col:cols[Math.floor(Math.random()*4)]});
  }
}
Boom.prototype.tick=function(){
  this.life-=0.02;this.r+=6;
  for(var i=0;i<this.pts.length;i++){
    var p=this.pts[i];p.x+=p.vx;p.y+=p.vy;p.life-=0.024;p.vy+=0.14;
  }
};
Boom.prototype.draw=function(){
  if(this.life<=0)return;
  ctx.save();ctx.globalAlpha=this.life*0.4;gw(R,24);ctx.strokeStyle=R;ctx.lineWidth=2.5;
  ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.stroke();
  ctx.globalAlpha=this.life*0.2;ctx.fillStyle="#ff4400";
  ctx.beginPath();ctx.arc(this.x,this.y,this.r*0.5,0,Math.PI*2);ctx.fill();ng();ctx.restore();
  for(var i=0;i<this.pts.length;i++){
    var p=this.pts[i];if(p.life<=0)continue;
    ctx.save();ctx.globalAlpha=p.life;gw(p.col,6);ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();ng();ctx.restore();
  }
};

function Pulse(x,y,col){this.x=x;this.y=y;this.col=col;this.r=0;this.life=1;}
Pulse.prototype.tick=function(){this.life-=0.025;this.r+=4;};
Pulse.prototype.draw=function(){
  if(this.life<=0)return;
  ctx.save();ctx.globalAlpha=this.life*0.5;gw(this.col,6);ctx.strokeStyle=this.col;ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,Math.PI*2);ctx.stroke();ng();ctx.restore();
};

function bub(x,y,txt,col,sub){
  ctx.save();
  ctx.fillStyle=col===G?"rgba(0,255,136,.14)":"rgba(255,51,51,.14)";
  ctx.strokeStyle=col;ctx.lineWidth=2;gw(col,14);
  ctx.beginPath();ctx.roundRect(x-74,y-24,148,38,7);ctx.fill();ctx.stroke();ng();
  ctx.fillStyle=col;ctx.font='bold 15px "Courier New"';ctx.textAlign="center";ctx.fillText(txt,x,y);
  if(sub){ctx.font='11px "Courier New"';ctx.fillText(sub,x,y+14);}
  ctx.restore();
}

var paused=false;

function moveTo(tx,ty,sp){
  var dx=tx-S.px,dy=ty-S.py,d=Math.sqrt(dx*dx+dy*dy);
  if(d<sp){S.px=tx;S.py=ty;return true;}
  S.px+=dx/d*sp;S.py+=dy/d*sp;return false;
}
function chaseEnemy(){
  if(S.eDead)return;
  var tx=S.px+60,ty=EYC;
  var dx=tx-S.ex,dy=ty-S.ey,d=Math.sqrt(dx*dx+dy*dy);
  if(d>4){S.ex+=dx/d*1.6;S.ey+=dy/d*1.6;}
}

function startScene(i){
  if(i>=SCENES.length)return;
  scIdx=i;scTimer=SCENES[i].fr;
  setLbl(SCENES[i].lbl);
  SCENES[i].fn();
}

  var jx=8, jy=H-8-jh2;  // bottom-left corner

}

  // Footer
  ctx.fillStyle="rgba(0,255,136,.4)";ctx.font='11px "Courier New"';ctx.textAlign="center";
  ctx.fillText("CRYPTOTAG IFF SYSTEM  •  UA-7731  •  МІСІЯ ЗАВЕРШЕНА",sx+sw/2,sy+sh-8);
  ctx.restore();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  drawBg();drawFront();
  ft+=0.04;
  var flt=Math.sin(ft)*3.5;

  // White key: ctrl→REB
  if(S.whiteKeyAnim>0&&S.whiteKeyAnim<1){
    S.whiteKeyAnim=Math.min(1,S.whiteKeyAnim+0.014);
    if(S.whiteKeyAnim>=1)S.whiteKeyAtREB=true;
  }
  // Yellow key: op→plane
  if(S.newKeyAnim>0){
    S.newKeyAnim=Math.min(1,S.newKeyAnim+0.02);
  }
  if(S.yellowKeyAnim>0&&S.yellowKeyAnim<1){
    S.yellowKeyAnim=Math.min(1,S.yellowKeyAnim+0.04);
    if(S.yellowKeyAnim>=1){S.yellowKeyOnPlane=true;}
  }
  // IFF key verification: yellow flies plane→REB, blinks, returns green
  if(S.iffKeyAnim>0&&S.iffKeyAnim<1){
    S.iffKeyAnim=Math.min(1,S.iffKeyAnim+0.016);
  }
  if(S.iffKeyAnim>=1&&S.iffBlinking){
    S.iffBlinkTimer++;
    if(S.iffBlinkTimer%12===0)S.iffBlinkCount++;
    if(S.iffBlinkCount>=5){
      S.iffBlinking=false;
      S.yellowKeyColor=G; // turn green!
      S.iffKeyReturn=0.01; // start return journey
    }
  }
  if(S.iffKeyReturn>0&&S.iffKeyReturn<1){
    S.iffKeyReturn=Math.min(1,S.iffKeyReturn+0.018);
    if(S.iffKeyReturn>=1){
      S.iffVerified=true;
      S.yellowKeyOnPlane=true;
      S.newKeyGenerating=false;
      S.newKeyVisible=true;
      S.newKeyAnim=0.01;
      // ── ЗЕЛЕНИЙ КЛЮЧ НА БОРТУ → ЗЕНІТКА ОДРАЗУ СТРІЛЯЄ ──
      S.zAim=true;
    }
  }
  // ctrl→op: жовтий ключ летить до оператора
  if(S.ctrlYellowAnim>0&&S.ctrlYellowAnim<1){
    S.ctrlYellowAnim=Math.min(1,S.ctrlYellowAnim+0.028);
    if(S.ctrlYellowAnim>=1){S.ctrlYellowDone=true;}
  }
  // op→plane: після того як оператор отримав ключ
  // (запускається в сцені 3, вже є в yellowKeyAnim)
  // handoff op→drone
  if(S.phase==="handoff"){
    S.tAnim=Math.min(1,S.tAnim+0.006);
    if(S.tAnim>=0.99){
      S.droneTag=true;S.opTag=false;S.phase="flyout";
      // Yellow key starts flying to plane
      if(!S.yellowKeyOnPlane)S.yellowKeyAnim=0.01;
    }
  }
  // flyout
  if(S.phase==="op_to_plane"){
    // Yellow key flies, when done → switch to flyout
    if(S.yellowKeyOnPlane) S.phase="flyout";
  }
  if(S.phase==="flyout"){
    moveTo(PRX,PRY,2.4);S.pdir=1;
  }
  // recon
  if(S.phase==="recon"){
    ra+=0.022;
    S.px=PRX-40+Math.cos(ra)*55;S.py=PRY+Math.sin(ra)*28;
    S.pdir=Math.cos(ra)>=0?1:-1;
  }
  // return
  if(S.phase==="return"){
    if(S.py>PRY2)S.py=Math.max(PRY2,S.py-2);
    moveTo(340,PRY2,2.0);S.pdir=-1;
    if(S.eneActive)chaseEnemy();
  }
  // iff
  if(S.phase==="iff"){
    moveTo(210,PRY2,1.1);S.pdir=-1;
    if(!S.eDead)chaseEnemy();
    if(S.sQF){S.sQF.x2=S.px;S.sQF.y2=S.py;}
    if(S.sRF){S.sRF.x1=S.px;S.sRF.y1=S.py;}
    if(S.sQE&&!S.eDead){S.sQE.x2=S.ex;S.sQE.y2=S.ey;}
    if(S.sRE&&!S.eDead){S.sRE.x1=S.ex;S.sRE.y1=S.ey;}
  }
  // endgame
  if(S.phase==="endgame"){
    if(!landed){
      if(moveTo(PHX,PHY,0.85)){
        landed=true;S.pdir=-1;
        // Місія виконана — тільки після знищення ворога
        if(S.eDead){
          S.finalOk=true;
          setSt("СВІЙ ПОВЕРНУВСЯ ДОДОМУ \u2713",G);
          addLog("> Посадка. Місія виконана!","lg");
        } else {
          setSt("БПЛА повернувся на базу",G);
        }
      }
      // Якщо вже приземлився але ворог щойно знищений
      if(landed&&S.eDead&&!S.finalOk){
        S.finalOk=true;
        setSt("СВІЙ ПОВЕРНУВСЯ ДОДОМУ \u2713",G);
        addLog("> Місія виконана!","lg");
      }
      S.pdir=-1;
    }
    if(S.zAim&&!fired){
      var dx2=S.ex-ZX,dy2=S.ey-(ZY+4);
      var targ=Math.atan2(dy2,dx2);
      S.zAng+=(targ-S.zAng)*0.02;
      if(Math.abs(targ-S.zAng)<0.25&&!S.shell){
        fired=true;S.mFlash=6;
        addLog("> ВОГОНЬ!","lr");
        setSt("ЗЕНІТКА — ВОГОНЬ!",R);
        var bx=ZX+Math.cos(S.zAng)*38,by=(ZY+4)+Math.sin(S.zAng)*38;
        S.shell=new Shell(bx,by,S.ex,S.ey,function(){
          explosions.push(new Boom(S.ex,S.ey));
          explosions.push(new Boom(S.ex+10,S.ey-10));
          S.eDead=true;S.done=true;
          // Прибираємо всі сигнали після знищення
          S.sQF=null;S.sRF=null;S.sQE=null;S.sRE=null;S.sFire=null;
          // Запускаємо вогнище на місці вибуху
          S.fire=new Fire(S.ex, S.ey);
          addLog("> ЦІЛЬ ЗНИЩЕНО \u2713","lr");
          setTimeout(function(){setSt("ЗАГРОЗА НЕЙТРАЛІЗОВАНА \u2713",R);},400);
          document.getElementById("restartBtn").style.display="inline-block";
          document.getElementById("pauseBtn").style.display="none";
        });
      }
    }
    if(!S.eDead&&S.eneActive)chaseEnemy();
    if(S.mFlash>0)S.mFlash--;
    if(S.shell)S.shell.tick();
  }

  // tick signals
  var sigs=[S.sQF,S.sRF,S.sQE,S.sRE,S.sFire];
  for(var i=0;i<sigs.length;i++){if(sigs[i])sigs[i].tick();}
  particles=particles.filter(function(p){return p.life>0;});
  for(var i=0;i<particles.length;i++)particles[i].tick();
  explosions=explosions.filter(function(e){return e.life>0;});
  for(var i=0;i<explosions.length;i++)explosions[i].tick();
  if(S.fire)S.fire.tick();

  // ── DRAW ──
  drawPerson(CX,CY,S.ctrlTag,"КОНТРОЛЕР Т");
  drawPerson(OX,OY,false,"ОПЕРАТОР");

  // (connector removed — operator acts independently)

  // arc ctrl→REB (private white key)

  // Жовтий ключ летить через flying keys анімацію

  drawREB(RX,RY);
  drawZenith(ZX,ZY,S.zAng);

  // flash
  if(S.mFlash>0){
    var fbx=ZX+Math.cos(S.zAng)*38,fby=(ZY+4)+Math.sin(S.zAng)*38;
    ctx.save();ctx.globalAlpha=S.mFlash/14;gw(Y,40);ctx.fillStyle=Y;
    ctx.beginPath();ctx.arc(fbx,fby,20,0,Math.PI*2);ctx.fill();ng();ctx.restore();
  }
  if(S.shell)S.shell.draw();

  // enemy
  if(S.eneActive&&!S.eDead){
    drawEnemy(S.ex,S.ey+flt);
    if(S.eExp){
      var qpts=[[-26,0],[26,0]];
      for(var qi=0;qi<qpts.length;qi++){
        var qa=ft*1.7+qi*Math.PI;
        ctx.save();ctx.fillStyle=R;ctx.font='bold 15px "Courier New"';
        ctx.textAlign="center";ctx.globalAlpha=0.5+Math.sin(qa)*0.4;
        gw(R,8);ctx.fillText("!",S.ex+Math.cos(qa)*26,S.ey+flt-24);ng();ctx.restore();
      }
    }
  }

  // friendly plane (show from scene 2 onwards)
  if(scIdx>=2||S.tAnim>0.15){
    drawPlane(S.px,S.py+flt,S.pdir,S.droneTag,1);
  }

  // signals
  for(var i=0;i<sigs.length;i++){if(sigs[i])sigs[i].draw();}
  for(var i=0;i<particles.length;i++)particles[i].draw();
  for(var i=0;i<explosions.length;i++)explosions[i].draw();
  if(S.fire)S.fire.draw();

  // ── Flying key animations ──
  // White key: ctrl → REB center
  if(S.whiteKeyAnim>0&&S.whiteKeyAnim<1){
    var t=S.whiteKeyAnim;
    var sx=CX+14,sy=CY-10,ex=RX,ey=RY+2;
    var kx=sx+(ex-sx)*t, ky=sy+(ey-sy)*t-40*Math.sin(t*Math.PI);
    ctx.save();gw("#ffffff",12);ctx.strokeStyle="#ffffff";ctx.fillStyle="#ffffff";ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(kx-6,ky,5,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(kx-6,ky,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(kx-1,ky);ctx.lineTo(kx+10,ky);ctx.stroke();
    ctx.beginPath();ctx.moveTo(kx+8,ky);ctx.lineTo(kx+8,ky+4);ctx.stroke();
    ng();ctx.restore();
  }

  // Ctrl → Op: жовтий ключ летить від контролера до оператора
  if(S.ctrlYellowAnim>0&&S.ctrlYellowAnim<1){
    var tcy=S.ctrlYellowAnim;
    var sxcy=CX+14,sycy=CY-10,excy=OX+14,eycy=OY-10;
    var kxcy=sxcy+(excy-sxcy)*tcy, kycy=sycy+(eycy-sycy)*tcy-30*Math.sin(tcy*Math.PI);
    ctx.save();gw(Y,14);ctx.strokeStyle=Y;ctx.fillStyle=Y;ctx.lineWidth=2.5;
    ctx.beginPath();ctx.arc(kxcy-6,kycy,5,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(kxcy-6,kycy,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(kxcy-1,kycy);ctx.lineTo(kxcy+10,kycy);ctx.stroke();
    ctx.beginPath();ctx.moveTo(kxcy+8,kycy);ctx.lineTo(kxcy+8,kycy+4);ctx.stroke();
    ctx.beginPath();ctx.moveTo(kxcy+5,kycy);ctx.lineTo(kxcy+5,kycy+3);ctx.stroke();
    ng();ctx.restore();
  }
  // Оператор тримає жовтий ключ після отримання
  if(S.ctrlYellowDone&&!S.yellowKeyOnPlane&&S.yellowKeyAnim===0){
    ctx.save();gw(Y,10);ctx.strokeStyle=Y;ctx.fillStyle=Y;ctx.lineWidth=2;
    var hkx=OX+14,hky=OY-12;
    ctx.beginPath();ctx.arc(hkx-5,hky,5,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(hkx-5,hky,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(hkx,hky);ctx.lineTo(hkx+10,hky);ctx.stroke();
    ctx.beginPath();ctx.moveTo(hkx+8,hky);ctx.lineTo(hkx+8,hky+4);ctx.stroke();
    ng();ctx.restore();
  }

  // Yellow key: op → plane
  if(S.yellowKeyAnim>0&&S.yellowKeyAnim<1){
    var t2=S.yellowKeyAnim;
    var sx2=OX+14,sy2=OY-10,ex2=S.px,ey2=S.py+16;
    var kx2=sx2+(ex2-sx2)*t2, ky2=sy2+(ey2-sy2)*t2-50*Math.sin(t2*Math.PI);
    ctx.save();gw(Y,12);ctx.strokeStyle=Y;ctx.fillStyle=Y;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(kx2-6,ky2,5,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(kx2-6,ky2,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(kx2-1,ky2);ctx.lineTo(kx2+10,ky2);ctx.stroke();
    ctx.beginPath();ctx.moveTo(kx2+8,ky2);ctx.lineTo(kx2+8,ky2+4);ctx.stroke();
    ng();ctx.restore();
  }

  // IFF: yellow key flies from plane to REB white key
  if(S.iffKeyAnim>0&&S.iffKeyAnim<1){
    var t3=S.iffKeyAnim;
    var sx3=S.px,sy3=S.py+16,ex3=RX,ey3=RY+2;
    var kx3=sx3+(ex3-sx3)*t3, ky3=sy3+(ey3-sy3)*t3-30*Math.sin(t3*Math.PI);
    ctx.save();gw(Y,14);ctx.strokeStyle=Y;ctx.fillStyle=Y;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(kx3-6,ky3,5,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(kx3-6,ky3,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(kx3-1,ky3);ctx.lineTo(kx3+10,ky3);ctx.stroke();
    ctx.beginPath();ctx.moveTo(kx3+8,ky3);ctx.lineTo(kx3+8,ky3+4);ctx.stroke();
    ng();ctx.restore();
  }

  // IFF: green key flies back from REB to plane
  if(S.iffKeyReturn>0&&S.iffKeyReturn<1){
    var t4=S.iffKeyReturn;
    var sx4=RX,sy4=RY+2,ex4=S.px,ey4=S.py+16;
    var kx4=sx4+(ex4-sx4)*t4, ky4=sy4+(ey4-sy4)*t4-30*Math.sin(t4*Math.PI);
    ctx.save();gw(G,16);ctx.strokeStyle=G;ctx.fillStyle=G;ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(kx4-6,ky4,5,0,Math.PI*2);ctx.stroke();
    ctx.beginPath();ctx.arc(kx4-6,ky4,2.5,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.moveTo(kx4-1,ky4);ctx.lineTo(kx4+10,ky4);ctx.stroke();
    ctx.beginPath();ctx.moveTo(kx4+8,ky4);ctx.lineTo(kx4+8,ky4+4);ctx.stroke();
    ng();ctx.restore();
  }

  drawScoreboard();
  drawJournal();

  // bubbles
  // "ЧУЖИЙ" — показуємо тільки поки живий
  if(S.eExp&&!S.eDead)bub(S.ex,S.ey-52,"ЧУЖИЙ \u2717",R,"знищити!");
  // "МІСІЯ ВИКОНАНА" — під літачком поряд з вогнем, після знищення
  // "Генерація нового ключа" info під літачком під час обчислення
  if(S.newKeyGenerating){
    ctx.save();
    var gx=S.px, gy=S.py+55;
    var pulse=0.6+Math.sin(Date.now()/200)*0.4;
    ctx.globalAlpha=pulse;
    gw(G,10);ctx.fillStyle=G;ctx.font='bold 11px "Courier New"';ctx.textAlign="center";
    ctx.fillText("⚡ Обчислення нового ключа...",gx,gy);ng();
    ctx.restore();
  }
  if(S.finalOk){
    var mx=S.px, my=S.py+55;
    ctx.save();
    ctx.fillStyle="rgba(0,20,10,.85)";
    ctx.beginPath();ctx.roundRect(mx-90,my-20,180,36,7);ctx.fill();
    gw(G,16);ctx.strokeStyle=G;ctx.lineWidth=2;
    ctx.beginPath();ctx.roundRect(mx-90,my-20,180,36,7);ctx.stroke();ng();
    ctx.fillStyle=G;ctx.font='bold 15px "Courier New"';ctx.textAlign="center";
    ctx.fillText("\u2713 МІСІЯ ВИКОНАНА",mx,my);
    ctx.font='11px "Courier New"';ctx.fillStyle="rgba(0,255,136,.7)";
    ctx.fillText("повернувся додому",mx,my+16);
    ctx.restore();
  }

  // scene timer
  if(!S.done){
    scTimer--;
    if(scTimer<=0&&scIdx<SCENES.length-1)startScene(scIdx+1);
  }

  raf=requestAnimationFrame(loop);
}

function startDemo(){init();}

window.addEventListener("load",function(){init();});
window.togglePause=function(){
  paused=!paused;
  var btn=document.getElementById("pauseBtn");
  if(paused){
    cancelAnimationFrame(raf);
    btn.textContent="▶ ПРОДОВЖИТИ";
    btn.style.borderColor="#ffcc00";btn.style.color="#ffcc00";
  } else {
    btn.textContent="⏸ ПАУЗА";
    btn.style.borderColor="#00ff88";btn.style.color="#00ff88";
    loop();
  }
};
window.init=init;
window.toggleSound=function(){
  var on = !(audioCtx && audioCtx.state==='suspended');
  if(on){
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    audioCtx.suspend();
    document.getElementById('soundBtn').textContent='🔇 ЗВУК';
  } else {
    audioCtx.resume();
    document.getElementById('soundBtn').textContent='🔊 ЗВУК';
  }
};
window.startDemo=startDemo;
})();
</script>
